name: 🛠️ Builds

on:
  workflow_call:
    secrets:
      PRIVATE_EOS_SDK_TOKEN:
        description: A token passed from the caller workflow
        required: true
    inputs:
      compatibility_minimum:
        description: The minimum godot version ('4.2' is fine, but '4.3' will add editor help)
        default: "4.3"
        required: true
        type: string
      sconsflags:
        description: Additional compile flags to use with scons
        default: ""
        required: false
        type: string
      temporary_artifact_suffix:
        description: Temporary artifact suffix
        required: true
        type: string
      artifact_suffix:
        description: Additional artifact suffix
        default: ""
        required: false
        type: string
      skip_32bit:
        description: Whether to skip 32-bit builds (from check-sdk-version job in the caller)
        required: true
        type: string

env:
  GODOT_BRANCH_FOR_GENERATE_DOCUMENTS: 4.3-stable
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
  BIT32_MATRIX: |
    [
      {"identifier":"🏁Windows-x86 (msvc)","runner":"windows-latest","platform":"windows","arch":"x86_32","godot_editor_suffix":"win64.exe","host_platform":"windows","force_compile_for_docs":true},
      {"identifier":"🤖Android-arm32","runner":"ubuntu-latest","platform":"android","arch":"arm32","godot_editor_suffix":"linux.x86_64","host_platform":"linux","force_compile_for_docs":true},
      {"identifier":"🤖Android-x86_32","runner":"ubuntu-latest","platform":"android","arch":"x86_32","godot_editor_suffix":"linux.x86_64","host_platform":"linux","force_compile_for_docs":true}
    ]

jobs:
  # ─── Build 64-bit (always runs) ───────────────────────────────────────────
  build-64bit:
    name: Build 64-bit platforms
    uses: ./.github/workflows/build-matrix.yml
    with:
      compatibility_minimum: ${{ inputs.compatibility_minimum }}
      sconsflags: ${{ inputs.sconsflags }}
      temporary_artifact_suffix: ${{ inputs.temporary_artifact_suffix }}
      skip_32bit: ${{ needs.check-sdk-version.outputs.skip_32bit }}
      matrix: |
        {
          "include": [
            {
              "identifier": "🐧Linux-x64",
              "runner": "ubuntu-latest",
              "platform": "linux",
              "arch": "x86_64",
              "godot_editor_suffix": "linux.x86_64",
              "host_platform": "linux"
            },
            {
              "identifier": "🍎Macos-Universal",
              "runner": "macos-latest",
              "platform": "macos",
              "arch": "universal",
              "godot_editor_suffix": "macos.universal",
              "host_platform": "macos"
            },
            {
              "identifier": "🏁Windows-x64 (clang)",
              "runner": "windows-latest",
              "platform": "windows",
              "arch": "x86_64",
              "additional_sconsflags": "use_clang_cl=yes",
              "godot_editor_suffix": "win64.exe",
              "host_platform": "windows"
            },
            {
              "identifier": "🤖Android-arm64",
              "runner": "ubuntu-latest",
              "platform": "android",
              "arch": "arm64",
              "godot_editor_suffix": "linux.x86_64",
              "host_platform": "linux",
              "force_compile_for_docs": true
            },
            {
              "identifier": "🤖Android-x86_64",
              "runner": "ubuntu-latest",
              "platform": "android",
              "arch": "x86_64",
              "godot_editor_suffix": "linux.x86_64",
              "host_platform": "linux",
              "force_compile_for_docs": true
            },
            {
              "identifier": "🍏ios-arm64",
              "runner": "macos-latest",
              "platform": "ios",
              "arch": "arm64"
            }
          ]
        }
    secrets: inherit

  # ─── Derive 32-bit matrix (single source of truth) ──────────────────────────
  # Reads BIT32_MATRIX env (the only place 32-bit platforms are listed) and
  # exposes it as a build matrix consumed by build-32bit.
  setup_bit32:
    name: Compute 32-bit matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate matrix from BIT32_MATRIX
        id: gen
        shell: python
        run: |
          import json
          import os

          entries = json.loads('''${{ env.BIT32_MATRIX }}''')
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": entries}) + "\n")

  # ─── Build 32-bit (skipped when EOS SDK > 1.18.1.2) ──────────────────────────
  build-32bit:
    name: Build 32-bit platforms
    # Skip the entire job when the EOS SDK does not support 32-bit platforms.
    if: inputs.skip_32bit != 'true'
    needs: [setup_bit32]
    uses: ./.github/workflows/build-matrix.yml
    with:
      compatibility_minimum: ${{ inputs.compatibility_minimum }}
      sconsflags: ${{ inputs.sconsflags }}
      temporary_artifact_suffix: ${{ inputs.temporary_artifact_suffix }}
      skip_32bit: ${{ needs.check-sdk-version.outputs.skip_32bit }}
      matrix: ${{ needs.setup_bit32.outputs.matrix }}
    secrets: inherit

  # ─── Merge Artifacts ────────────────────────────────────────────────────────
  merge_artifacts:
    runs-on: ubuntu-latest
    needs: [build-64bit, build-32bit]
    # Run only when 64-bit succeeded and 32-bit either succeeded or was skipped
    # (skipped is allowed because the EOS SDK may not support 32-bit). If either
    # build actually failed, do NOT merge.
    if: >-
      always() &&
      !cancelled() &&
      needs.build-64bit.result == 'success' &&
      (needs.build-32bit.result == 'success' || needs.build-32bit.result == 'skipped')
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup version
        run: echo BUILD_VERSION=$(head -n 1 ./version) >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ github.event.repository.name }}-min-godot-${{ inputs.compatibility_minimum }}${{ inputs.temporary_artifact_suffix }}*
          merge-multiple: true
          path: ./artifacts/GD-EOS/

      - name: Postprocess .gdextension files (drop 32-bit libs when unsupported)
        shell: python
        run: |
          import os
          import re
          import json

          skip_32bit = "${{ inputs.skip_32bit }}" == "true"
          bit32_prefixes = tuple(f"{e['platform']}.{e['arch']}" for e in json.loads('''${{ env.BIT32_MATRIX }}'''))

          gdextension_files = [
              "artifacts/GD-EOS/addons/gd-eos/gd-eos.gdextension",
              "artifacts/GD-EOS/addons/gd-eos/gd-eos-editor.gdextension",
          ]

          key_re = re.compile(r"^([A-Za-z0-9_.\-]+)\s*=")

          for rel in gdextension_files:
              path = rel
              if not os.path.isfile(path):
                  print(f"::warning::Skipping missing {rel}")
                  continue
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              kept = []
              removed = []
              for line in lines:
                  stripped = line.strip()
                  m = key_re.match(stripped)
                  key = ".".join(p for p in m.group(1).split(".") if p != "editor") if m else ""
                  if skip_32bit and key.startswith(bit32_prefixes):
                      removed.append(stripped)
                      continue
                  kept.append(line)
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(kept)
              if skip_32bit and removed:
                  print(f"Removed 32-bit entries from {rel}: {', '.join(removed)}")
              else:
                  print(f"Kept all entries in {rel} (skip_32bit={skip_32bit})")

      # Upload the post-processed directory as a temporary artifact so the
      # official merge action can absorb it. The name is prefixed with the same
      # base as the per-platform artifacts so the merge action's `pattern`
      # matches it and `delete-merged: true` removes it afterwards. The "-zzz-"
      # segment sorts last, so this artifact merges after the per-platform ones
      # and its edited .gdextension files override the unedited ones.
      - name: Upload post-processed artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-min-godot-${{ inputs.compatibility_minimum }}${{ inputs.temporary_artifact_suffix }}-zzz-postprocessed
          path: ./artifacts/GD-EOS/
          retention-days: 1

      - name: Merge Artifacts to all in one
        uses: actions/upload-artifact/merge@v7
        with:
          name: ${{ github.event.repository.name }}-${{ env.BUILD_VERSION }}-min-godot-${{ inputs.compatibility_minimum }}${{ inputs.artifact_suffix }}
          pattern: ${{ github.event.repository.name }}-min-godot-${{ inputs.compatibility_minimum }}${{ inputs.temporary_artifact_suffix }}*
          delete-merged: true
          retention-days: 90
