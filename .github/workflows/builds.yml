name: 🛠️ Builds

on:
  workflow_call:
    secrets:
      PRIVATE_EOS_SDK_TOKEN:
        description: A token passed from the caller workflow
        required: true
    inputs:
      compatibility_minimum:
        description: The minimum godot version ('4.2' is fine, but '4.3' will add editor help)
        default: "4.3"
        required: true
        type: string
      sconsflags:
        description: Additional compile flags to use with scons
        default: ""
        required: false
        type: string
      temporary_artifact_suffix:
        description: Temporary artifact suffix
        required: true
        type: string
      artifact_suffix:
        description: Additional artifact suffix
        default: ""
        required: false
        type: string
      skip_32bit:
        description: Whether to skip 32-bit builds (from check-sdk-version job in the caller)
        required: true
        type: string

env:
  GODOT_BRANCH_FOR_GENERATE_DOCUMENTS: 4.3-stable
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache/

jobs:
  # ─── Build 64-bit (always runs) ───────────────────────────────────────────
  build-64bit:
    name: Build 64-bit platforms
    uses: ./.github/workflows/build-matrix.yml
    with:
      compatibility_minimum: ${{ inputs.compatibility_minimum }}
      sconsflags: ${{ inputs.sconsflags }}
      temporary_artifact_suffix: ${{ inputs.temporary_artifact_suffix }}
      skip_32bit: ${{ needs.check-sdk-version.outputs.skip_32bit }}
      matrix: |
        {
          "include": [
            {
              "identifier": "🐧Linux-x64",
              "runner": "ubuntu-latest",
              "platform": "linux",
              "arch": "x86_64",
              "godot_editor_suffix": "linux.x86_64",
              "host_platform": "linux"
            },
            {
              "identifier": "🍎Macos-Universal",
              "runner": "macos-latest",
              "platform": "macos",
              "arch": "universal",
              "godot_editor_suffix": "macos.universal",
              "host_platform": "macos"
            },
            {
              "identifier": "🏁Windows-x64 (clang)",
              "runner": "windows-latest",
              "platform": "windows",
              "arch": "x86_64",
              "additional_sconsflags": "use_clang_cl=yes",
              "godot_editor_suffix": "win64.exe",
              "host_platform": "windows"
            },
            {
              "identifier": "🤖Android-arm64",
              "runner": "ubuntu-latest",
              "platform": "android",
              "arch": "arm64",
              "godot_editor_suffix": "linux.x86_64",
              "host_platform": "linux",
              "force_compile_for_docs": true
            },
            {
              "identifier": "🤖Android-x86_64",
              "runner": "ubuntu-latest",
              "platform": "android",
              "arch": "x86_64",
              "godot_editor_suffix": "linux.x86_64",
              "host_platform": "linux",
              "force_compile_for_docs": true
            },
            {
              "identifier": "🍏ios-arm64",
              "runner": "macos-latest",
              "platform": "ios",
              "arch": "arm64"
            }
          ]
        }
    secrets: inherit

  # ─── Build 32-bit (skipped when EOS SDK > 1.18.1.2) ──────────────────────────
  build-32bit:
    name: Build 32-bit platforms
    # Skip the entire job when the EOS SDK does not support 32-bit platforms.
    if: inputs.skip_32bit != 'true'
    uses: ./.github/workflows/build-matrix.yml
    with:
      compatibility_minimum: ${{ inputs.compatibility_minimum }}
      sconsflags: ${{ inputs.sconsflags }}
      temporary_artifact_suffix: ${{ inputs.temporary_artifact_suffix }}
      skip_32bit: ${{ needs.check-sdk-version.outputs.skip_32bit }}
      matrix: |
        {
          "include": [
            {
              "identifier": "🏁Windows-x86 (msvc)",
              "runner": "windows-latest",
              "platform": "windows",
              "arch": "x86_32",
              "godot_editor_suffix": "win64.exe",
              "host_platform": "windows",
              "force_compile_for_docs": true
            },
            {
              "identifier": "🤖Android-arm32",
              "runner": "ubuntu-latest",
              "platform": "android",
              "arch": "arm32",
              "godot_editor_suffix": "linux.x86_64",
              "host_platform": "linux",
              "force_compile_for_docs": true
            },
            {
              "identifier": "🤖Android-x86_32",
              "runner": "ubuntu-latest",
              "platform": "android",
              "arch": "x86_32",
              "godot_editor_suffix": "linux.x86_64",
              "host_platform": "linux",
              "force_compile_for_docs": true
            }
          ]
        }
    secrets: inherit

  # ─── Merge Artifacts ────────────────────────────────────────────────────────
  merge_artifacts:
    runs-on: ubuntu-latest
    needs: [build-64bit, build-32bit]
    # Run only when 64-bit succeeded and 32-bit either succeeded or was skipped
    # (skipped is allowed because the EOS SDK may not support 32-bit). If either
    # build actually failed, do NOT merge.
    if: >-
      always() &&
      !cancelled() &&
      needs.build-64bit.result == 'success' &&
      (needs.build-32bit.result == 'success' || needs.build-32bit.result == 'skipped')
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup version
        run: echo BUILD_VERSION=$(head -n 1 ./version) >> $GITHUB_ENV

      - name: Merge Artifacts to all in one
        uses: actions/upload-artifact/merge@v6
        with:
          name: ${{ github.event.repository.name }}-${{ env.BUILD_VERSION }}-min-godot-${{ inputs.compatibility_minimum }}${{ inputs.artifact_suffix }}
          pattern: ${{ github.event.repository.name }}-min-godot-${{ inputs.compatibility_minimum }}${{ inputs.temporary_artifact_suffix }}*
          delete-merged: true
          retention-days: 90
