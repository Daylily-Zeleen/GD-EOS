  #   uses: ./.github/workflows/builds.yml
  #   secrets: inherit
  #   with:
  #     compatibility_minimum: '4.2'
  #     sconsflags: ''
  #     temporary_artifact_suffix: '_no_aoolu'
  #     artifact_suffix: ''
  #     skip_32bit: ${{ needs.check-sdk-version.outputs.skip_32bit }}

  # min-godot-v4_2-AOOLU:
  #   needs: check-sdk-version
  #   uses: ./.github/workflows/builds.yml
  #   secrets: inherit
  #   with:
  #     compatibility_minimum: '4.2'
  #     sconsflags: assume_only_one_local_user=yes
  #     temporary_artifact_suffix: _aoolu
  #     artifact_suffix: _aoolu
  #     skip_32bit: ${{ needs.check-sdk-version.outputs.skip_32bit }}

  min-godot-v4_3:
    needs: check-sdk-version
    uses: ./.github/workflows/builds.yml
    secrets: inherit
    with:
      compatibility_minimum: '4.3'
      sconsflags: ''
      temporary_artifact_suffix: '_no_aoolu'
      artifact_suffix: ''
      skip_32bit: ${{ needs.check-sdk-version.outputs.skip_32bit }}

  min_godot-v4_3-AOOLU:
    needs: check-sdk-version
    uses: ./.github/workflows/builds.yml
    secrets: inherit
    with:
      compatibility_minimum: '4.3'
      sconsflags: assume_only_one_local_user=yes
      temporary_artifact_suffix: _aoolu
      artifact_suffix: _aoolu
      skip_32bit: ${{ needs.check-sdk-version.outputs.skip_32bit }}
